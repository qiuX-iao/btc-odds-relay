name: fetch-polymarket-odds

# A relay, not a workaround: this project cannot generate its own entry prices, and
# the machine the bot runs on cannot reach Polymarket. GitHub's runners can, so they
# run the SAME tool (`tools/fetch-polymarket-odds.mjs`) and commit the CSV; the local
# side pulls it over `raw.githubusercontent.com`, which this machine CAN reach.
#
# Nothing here changes the data's meaning: the remote writes rows, nothing else. Use
# `tools/pull-relay-odds.mjs` locally, then ALWAYS validate with `odds-check` before
# trusting any number that came out of it.

on:
  schedule:
    # Every 10 minutes, at :06/:16/:26/:36/:46/:56 UTC.
    #
    # This was `17 * * * *` and it never fired once: measured 2026-09-28, the relay
    # repo had 9 runs, every one `workflow_dispatch`, `?event=schedule` returned 0, and
    # the 11:17Z slot was 39 minutes late and still empty. GitHub's scheduler is
    # best-effort -- a slot it drops is not deferred, it is gone.
    #
    # WHY DENSITY, NOT JUST RELIABILITY. Measured over 10 runs on 2026-09-28, a sweep
    # prices ONLY the last one or two windows it enumerates (13:36Z run -> 13:30Z
    # window; 13:40:54Z run -> 13:35Z and 13:30Z). The other ~69 windows come back
    # `no-market`: Polymarket delists a 5m updown market minutes after it settles, so a
    # window is readable only for roughly its first 5-11 minutes. The enumerated range
    # ends at `floor5(now) - 5m`, i.e. the freshest window is always 5-10 minutes old --
    # inside that band, but with little margin, which is why a single hourly slot either
    # catches one window or catches none.
    #
    # So cadence IS the yield: one run/hour buys 0-2 windows/hour. `*/10` gives every
    # window a run at age ~6 minutes (the freshest this geometry allows), i.e. ~6
    # windows/hour instead of ~1.
    #
    # `:06` and not `:05`: the range end is `floor5(until) - 5m`, so minute ≡ 0 mod 5
    # sits exactly on a window boundary and an off-by-one in close-time handling would
    # silently cost the window. Minute ≡ 1 mod 5 is one minute of deliberate slack.
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO start (default: 20 minutes ago -- older windows have no market left)'
        required: false
      until:
        description: 'ISO end (default: now)'
        required: false
      window:
        description: 'window length (5m is the series still trading; see the Fetch step)'
        required: false
        default: '5m'
      slug_prefix:
        description: 'market slug prefix (default: btc-updown-<window>; use eth-updown-<window> for ETH)'
        required: false
      probe:
        description: 'dump one window of raw JSON and stop'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialize runs. Every run ends in `git push` to the same branch, and the schedule is
# now dense enough (every 10 minutes) that a delayed slot can overlap the next one --
# two concurrent jobs is exactly the non-fast-forward race that turned 3 of the first 7
# relay runs red. Queued, not cancelled: a run that is already fetching holds the only
# copy of that window's price, and a later run cannot recover it.
concurrency:
  group: relay-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `npm ci`: the tool is dependency-free on purpose, and a cache would
          # only add a moving part to a job whose whole job is being reliable.

      # Prove the upstream schema before trusting a batch. Cheap, and the only way
      # to notice Polymarket changed a field instead of silently pricing nothing.
      #
      # `--from`/`--to` take ISO 8601 or epoch ms ONLY -- the tool rejects relative
      # strings like `now-24h` with exit 2. The defaults are therefore computed here
      # in the shell. (They used to be the literal strings `now-24h`/`now`, which made
      # every probe fail until someone finally dispatched it.)
      - name: Probe one window (optional)
        if: ${{ inputs.probe }}
        run: |
          set -euo pipefail
          SINCE="${{ inputs.since || '' }}"
          UNTIL="${{ inputs.until || '' }}"
          [ -z "$SINCE" ] && SINCE="$(date -u -d '-20 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          [ -z "$UNTIL" ] && UNTIL="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PREFIX="${{ inputs.slug_prefix || '' }}"
          if [ -z "$PREFIX" ]; then PREFIX="btc-updown-${{ inputs.window || '5m' }}"; fi
          node tools/fetch-polymarket-odds.mjs \
            --probe \
            --window "${{ inputs.window || '5m' }}" \
            --slug-prefix "$PREFIX" \
            --from "$SINCE" \
            --to "$UNTIL"

      - name: Fetch per-window odds
        run: |
          set -uo pipefail
          # 20 minutes, not 6 hours. Measured 2026-09-28 over 10 runs: a 6h sweep issues
          # 71 upstream requests and prices at most the LAST one or two windows in that
          # list -- 13:36Z run -> 13:30Z window, 13:40:54Z run -> 13:35Z and 13:30Z.
          # Every older window answers `no-market`, because Polymarket delists a 5m
          # updown market minutes after it settles. The other 69 requests buy nothing.
          #
          # That is not just waste, it is a cost: 4-at-a-time over 71 windows is heavy
          # enough that a burst of runs can start coming back all-`no-market` (observed
          # on 13:42:59Z after a manual test burst). `no-market` conflates "absent" with
          # "gamma refused us" -- tools/fetch-polymarket-odds.mjs records the per-window
          # detail (`gamma HTTP 429`) but the summary line only prints the reason count,
          # so a throttled sweep is indistinguishable from a quiet market. Asking for 4
          # windows instead of 71 keeps us away from that edge.
          SINCE="${{ inputs.since || '' }}"
          UNTIL="${{ inputs.until || '' }}"
          [ -z "$SINCE" ] && SINCE="$(date -u -d '-20 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          [ -z "$UNTIL" ] && UNTIL="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          STAMP="$(date -u '+%Y-%m-%dT%H%M%SZ')"

          # A manual dispatch reads the ONE market asked for. The scheduled run
          # reads the two series this project actually consumes: 5m BTC (the paper
          # bot) and 5m ETH (the reference account being reproduced).
          #
          # 5m, not 15m: measured 2026-09-28, a sweep priced 1/71 five-minute windows
          # and 0/24 fifteen-minute ones -- `no-market` for every other. The market only
          # exists for windows near the present, so one run can only read the window in
          # front of it. That is why this accumulates instead of back-filling.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PREFIXES="btc-updown-5m eth-updown-5m"
          else
            IN_WINDOW="${{ inputs.window || '' }}"
            PREFIXES="${{ inputs.slug_prefix || '' }}"
            [ -z "$PREFIXES" ] && PREFIXES="btc-updown-${IN_WINDOW:-5m}"
          fi

          # The file name keeps the `polymarket-odds-` prefix that
          # tools/pull-relay-odds.mjs filters on, then the asset. One asset has to be
          # pullable without the other: the local merge de-duplicates by windowStart
          # and would silently collide BTC with ETH landing on the same timestamp.
          priced=0
          for PREFIX in $PREFIXES; do
            WINDOW="${{ inputs.window || '' }}"
            [ -z "$WINDOW" ] && WINDOW="${PREFIX##*-}"
            ASSET="${PREFIX%%-*}"
            OUT="data/relay/polymarket-odds-${ASSET}-${WINDOW}-${STAMP}.csv"
            echo "--- $PREFIX | window $WINDOW | range $SINCE .. $UNTIL ---"
            # Exits non-zero and writes NOTHING when zero rows resolve: a truncated
            # file would read as "the market was only open sometimes".
            if node tools/fetch-polymarket-odds.mjs \
                 --from "$SINCE" --to "$UNTIL" --window "$WINDOW" --slug-prefix "$PREFIX" \
                 --out "$OUT"; then
              echo "rows=$(wc -l < "$OUT")"
              priced=$((priced + 1))
            else
              echo "::warning::$PREFIX priced nothing in this range"
            fi
          done

          # Fail only when EVERY series came back empty: a real upstream outage stays
          # visible without one quiet series turning the whole job red.
          if [ "$priced" -eq 0 ]; then
            echo "no series priced anything -- failing so the miss stays visible"
            exit 1
          fi
          echo "priced $priced series"

      # One file per run, rather than appending to one file: each fetch stays
      # independently auditable and a bad run cannot corrupt earlier history. The
      # local `pull-relay-odds.mjs` merges whichever files it finds.
      - name: Commit any new file
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/relay)" ]; then
            echo "no new rows to commit"
            exit 0
          fi
          git config user.name  "polymarket-odds relay"
          git config user.email "relay@example.invalid"
          git add data/relay
          git commit -m "relay: polymarket odds $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push
